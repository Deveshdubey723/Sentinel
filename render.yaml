services:
  - type: web
    name: sentinel-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: sentinel_db
      - key: FRONTEND_URLS
        sync: false
